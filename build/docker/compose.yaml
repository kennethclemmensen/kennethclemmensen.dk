name: kennethclemmensen.test

services:
  php:
    build:
      context: ../..
      dockerfile_inline: |
        # Set the base image
        FROM php:8.5.12-apache

        # Setup the mysqli php extension and enable mod_rewrite
        RUN docker-php-ext-install mysqli \
            && printf '%s\n' 'mysqli.default_socket=/var/run/mysqld/mysqld.sock' \
                > /usr/local/etc/php/conf.d/mysqli.ini \
            && a2enmod rewrite

        # Copy the public directory to the container
        COPY public/ /var/www/html/kennethclemmensen.test/

        # Create a virtual host
        RUN printf '%s\n' \
          '<VirtualHost *:80>' \
          '    ServerName kennethclemmensen.test' \
          '    DocumentRoot /var/www/html/kennethclemmensen.test' \
          '</VirtualHost>' \
          > /etc/apache2/sites-available/000-default.conf
    depends_on:
      # wait for the MySQL service to be healthy before starting the PHP service
      mysql:
        condition: service_healthy
    ports:
      - 80:80
    volumes:
      # mount the mysqld directory to the mysql-data volume to persist the data
      - mysql-data:/var/run/mysqld

  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: TestUser
      MYSQL_PASSWORD: TestUserForLocalhost
      MYSQL_DATABASE: kennethclemmensen_test_db
    build:
      context: ../..
      dockerfile_inline: |
        # Set the base image
        FROM mysql:26.7.0

        # Copy dump.sql to the directory
        ARG DIRECTORY=/docker-entrypoint-initdb.d
        COPY tests/wpbrowser/Support/Data/dump.sql $$DIRECTORY
    volumes:
      # mount the mysqld directory to the mysql-data volume to persist the data
      - mysql-data:/var/run/mysqld
    healthcheck:
      # setup the healthcheck for the MySQL service
      test: [
        "CMD-SHELL",
        "mysqladmin ping --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"
      ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    
volumes:
  mysql-data: